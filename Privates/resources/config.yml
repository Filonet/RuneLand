# Конфигурация плагина приватов

# Настройки языка
language: "ru_RU"  # ru_RU или en_US

# Настройки приватов
settings:
  # Максимальное количество приватов зависит от привилегии игрока:
  # NONE: 1, HERO: 2, HUNTER: 4, RANGER: 12, ELEMENTAL: 20, 
  # PHANTOM: 35, ARCANA: 50, TITAN: 100, ELDER: 200
  
  # Автосохранение (в секундах)
  auto-save-interval: 300
  
  # Защита от взрывов в приватах
  protect-from-explosions: true
  
  # Защита от огня в приватах
  protect-from-fire: true
  
  # Разрешить PvP в приватах
  allow-pvp-in-privates: false

# Размеры приватов для блоков
block-sizes:
  iron: 5      # Железный блок - 5x5x5
  gold: 7      # Золотой блок - 7x7x7
  diamond: 11  # Алмазный блок - 11x11x11
  emerald: 21  # Изумрудный блок - 21x21x21
  netherite: 31 # Незеритовый блок - 31x31x31

# Разрешенные миры для создания приватов
allowed-worlds:
  - "world"

# Отладочный режим
debug: false 