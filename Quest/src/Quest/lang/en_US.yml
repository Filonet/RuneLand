quest.hunter.quest2.first: "§6Skeletons are ancient guardians of darkness! §fTheir bones are valuable material for alchemy. §eGet §66 bones§e from skeletons. Be careful of their arrows!"
quest.hunter.quest2.second: "§aMagnificent! §fThese bones are white as snow and strong as steel. §eYou've proven you can fight the archers of darkness!"

