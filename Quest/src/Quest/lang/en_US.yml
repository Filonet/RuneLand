# FARMER - Quests for drops from breedable mobs
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

# Quest 1: First eggs
quest.farmer.quest1.first: "§6Welcome to the farm! §fI'm a §bfarmer§f and I breed animals. §eLet's start simple - bring me §610 eggs§e from chickens. This is the foundation of any homestead!"
quest.farmer.quest1.second: "§aExcellent! §fThese eggs will be useful for cooking and breeding new chickens. §eNow you're ready for the next task!"

# Quest 2: Chicken meat
quest.farmer.quest2.first: "§6Poultry farming is an important part of agriculture. §fBring me §65 raw chicken meat§f. §eThis will show that you know how to handle poultry properly."
quest.farmer.quest2.second: "§aSuperb! §fChicken meat is a valuable source of protein. §eLet's continue developing your livestock skills!"

# Quest 3: Feathers for pillows
quest.farmer.quest3.first: "§6Chickens give more than just meat and eggs! §fCollect §615 feathers§f - they're needed for making pillows and arrows. §eShow that you value every gift of nature!"
quest.farmer.quest3.second: "§aWonderful! §fThese feathers are soft and high quality. §eYou're learning to use all resources that animals provide!"

# Quest 4: Pork for feast
quest.farmer.quest4.first: "§6Time to get into pig farming! §fPigs are undemanding animals that give delicious meat. §eBring me §68 pieces of raw pork§e for a festive feast!"
quest.farmer.quest4.second: "§aMagnificent! §fThis pork turned out excellent, fatty and juicy. §eYour farmer skills grow every day!"

# Quest 5: Leather for crafting
quest.farmer.quest5.first: "§6Animal husbandry gives more than just meat! §fLeather is a valuable material for craftsmen. §eGet §612 pieces of leather§e from cows. This requires patience and skill!"
quest.farmer.quest5.second: "§aExcellent! §fThis leather is high quality, soft and durable. §eNow you understand the value of every animal!"

# Quest 6: Premium beef
quest.farmer.quest6.first: "§6Cows are the foundation of animal husbandry! §fThey give milk, leather and excellent meat. §eBring me §66 pieces of raw beef§e of the highest quality!"
quest.farmer.quest6.second: "§aDelightful! §fThis beef is marbled with fat streaks - a real delicacy! §eYou're becoming a true master!"

# Quest 7: Wool for clothing
quest.farmer.quest7.first: "§6Sheep farming is the art of obtaining wool! §fSheep give us warm wool for clothing. §eCollect §620 blocks of white wool§e. Shear carefully!"
quest.farmer.quest7.second: "§aWonderful! §fThis wool is soft and fluffy, perfect for warm clothing. §eYou've mastered the basics of sheep farming!"

# Quest 8: Rest - animal care
quest.farmer.quest8.first: "§6Time to rest and think about animal welfare. §fHealthy and happy animals give better products. §eTake care of your pets, and they will reward you!"
quest.farmer.quest8.second: "§aGood! §fCaring for animals is the foundation of successful farming. §eNow you're ready for more complex tasks!"

# Quest 9: Meat variety
quest.farmer.quest9.first: "§6A real farmer breeds different animals! §fShow your mastery: bring §610 chicken§f, §610 pork§f and §68 beef§f. §eDiversity is the key to success!"
quest.farmer.quest9.second: "§aMagnificent! §fSuch an assortment of meat speaks of your professionalism. §eYou can be proud of your achievements!"

# Quest 10: Large batch of eggs
quest.farmer.quest10.first: "§6Your poultry farm should work at full capacity! §fI need a large batch of eggs for city deliveries. §eBring §632 eggs§e!"
quest.farmer.quest10.second: "§aAmazing! §fSuch a quantity of quality eggs is a sign of a well-organized farm! §eYou're a true professional!"

# Quest 11: Colored wool
quest.farmer.quest11.first: "§6Time to master wool dyeing! §fMulticolored wool is valued higher than regular. §eBring §616 blocks each§e of white, orange, purple and light blue wool!"
quest.farmer.quest11.second: "§aAmazing! §fThese bright colors will decorate any clothing. §eYou've mastered the art of working with dyes!"

# Quest 12: Rabbit farming
quest.farmer.quest12.first: "§6Rabbits are fast-breeding animals! §fThey give meat and hides for light leather. §eBring §615 rabbit meat§e and §610 rabbit hides§e!"
quest.farmer.quest12.second: "§aExcellent! §fRabbits are indeed prolific, and their fur is very soft. §eYou're expanding your farming business!"

# Quest 13: Mutton for restaurant
quest.farmer.quest13.first: "§6Mutton is a delicacy for gourmets! §fSheep give not only wool but also tender meat. §eBring §612 pieces of raw mutton§e for an elite restaurant!"
quest.farmer.quest13.second: "§aDelightful! §fThis mutton has a delicate taste and tender texture. §eYour reputation as a farmer is growing!"

# Quest 14: Mass leather production
quest.farmer.quest14.first: "§6The leather industry needs raw materials! §fLarge orders require large volumes. §eSupply §632 pieces of leather§e for large-scale production!"
quest.farmer.quest14.second: "§aMagnificent! §fSuch a volume of quality leather will provide work for an entire workshop! §eYou think like a true entrepreneur!"

# Quest 15: Variegated wool
quest.farmer.quest15.first: "§6Fashion demands bright colors! §fCollect a rainbow of colors for fashion designers. §eNeed §612 blocks each§e of yellow, lime, pink, gray and light gray wool!"
quest.farmer.quest15.second: "§aAmazing! §fThis color palette will allow creating the most fashionable outfits! §eYou understand market demands!"

# Quest 16: Poultry factory
quest.farmer.quest16.first: "§6Time to create a real poultry factory! §fIndustrial-scale poultry farming requires mastery. §eBring §625 chicken§e, §640 feathers§e and §648 eggs§e!"
quest.farmer.quest16.second: "§aIncredible! §fSuch productivity is worthy of the most modern poultry farms! §eYou're a master of industrial poultry farming!"

# Quest 17: Rest - farm improvement
quest.farmer.quest17.first: "§6Time to modernize the farm! §fImproving animal housing conditions will increase product quality. §eThink about new pens, feeders and waterers!"
quest.farmer.quest17.second: "§aExcellent! §fA modern farm with good conditions is the key to high product quality! §eYou think strategically!"

# Quest 18: Meat assortment
quest.farmer.quest18.first: "§6The meat processing plant ordered a full assortment! §fMeat variety is the foundation of healthy nutrition. §eSupply §620 beef§e, §620 pork§e, §615 mutton§e and §625 rabbit§e!"
quest.farmer.quest18.second: "§aDelightful! §fSuch an assortment will provide the city with quality meat for a month! §eYour farm has become a real enterprise!"

# Quest 19: Rainbow wool
quest.farmer.quest19.first: "§6Artists ordered all colors of the rainbow! §fBright wool is needed for creating works of art. §eCollect §610 blocks each§e of cyan, purple, blue, brown, green, red and black wool!"
quest.farmer.quest19.second: "§aAmazing! §fThis rainbow of colors will inspire artists to create masterpieces! §eYou create beauty with your own hands!"

# Quest 20: Leatherworking
quest.farmer.quest20.first: "§6The leather workshop is expanding! §fLots of raw materials needed for producing armor and saddles. §eSupply §664 pieces of regular leather§e and §632 rabbit hides§e!"
quest.farmer.quest20.second: "§aMagnificent! §fDifferent types of leather will allow creating products for any taste! §eYou supply the entire region with quality raw materials!"

# Quest 21: Rest - equipment modernization
quest.farmer.quest21.first: "§6Time to update farm equipment! §fModern technologies will help increase productivity and improve conditions for animals. §eInvestments in the future always pay off!"
quest.farmer.quest21.second: "§aExcellent! §fNew equipment will make your farm exemplary! §eNow you're ready for the most ambitious projects!"

# Quest 22: Industrial livestock
quest.farmer.quest22.first: "§6Large order from the capital market! §fHuge volumes of meat needed to supply the city. §eSupply §640 beef§e, §640 pork§e, §650 chicken§e, §630 mutton§e and §635 rabbit§e!"
quest.farmer.quest22.second: "§aIncredible! §fSuch production volumes make you one of the largest suppliers in the region! §eYou've reached industrial scale!"

# Quest 23: Feather pillow
quest.farmer.quest23.first: "§6Royal order for luxury pillows! §fMany feathers needed for stuffing the softest pillows. §eCollect §6128 feathers§e of the highest quality!"
quest.farmer.quest23.second: "§aDelightful! §fThese feathers will make pillows worthy of a royal bedroom! §eYour products are valued in the highest circles!"

# Quest 24: Wool empire
quest.farmer.quest24.first: "§6Create a wool empire! §fThe textile factory ordered a huge batch of multicolored wool. §eSupply §664 white§e, §632 each§e of orange, yellow, blue, red and black wool!"
quest.farmer.quest24.second: "§aAmazing! §fYour wool empire will clothe half the continent! §eYou've become a textile industry magnate!"

# Quest 25: Master of livestock
quest.farmer.quest25.first: "§6Final test of mastery! §fShow all your livestock skills. §eSupply §6128 eggs§e, §696 leather§e, §664 beef§e, §664 pork§e, §680 chicken§e, §6160 feathers§e and §6128 white wool§e!"
quest.farmer.quest25.second: "§aLegendary! §fYou've reached the pinnacle of livestock mastery! §eNow you are the §6Grand Master Farmer§e, and your fame will spread across all lands! §bYour farm has become a model to follow!"

