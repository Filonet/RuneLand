quest.all.passed: "You have completed all quests!"

# WOODCUTTER
quest.woodcutter.quest1.first: "Newbie, you don't go into the forest without a §ewooden axe§r. Make one and come back."
quest.woodcutter.quest1.second: "A §ewooden axe§r is weak, but it'll do for starters."

quest.woodcutter.quest2.first: "Time to test what you're made of. Get me §e10 oak logs§r."
quest.woodcutter.quest2.second: "Good, not bad for the first time. Let's continue!"

quest.woodcutter.quest3.first: "Saw the logs into §e32 oak planks§r. Show the confidence of a real lumberjack!"
quest.woodcutter.quest3.second: "Now I can see things are moving forward!"

quest.woodcutter.quest4.first: "You won't get far with such an axe. Make yourself a §estone axe§r already."
quest.woodcutter.quest4.second: "Perfect! With such a tool, trees will fall by themselves."

quest.woodcutter.quest5.first: "Test your new axe in action: get §e32 oak blocks§r."
quest.woodcutter.quest5.second: "You've really got the hang of it, well done!"

quest.woodcutter.quest6.first: "You've earned a rest. Come back later - there'll be work."
quest.woodcutter.quest6.second: "Work calling again? Great, I have plenty of it."

quest.woodcutter.quest7.first: "Now a more serious task: §e64 oak blocks§r. Can you handle it?"
quest.woodcutter.quest7.second: "Impressive! Faster and stronger each time."

quest.woodcutter.quest8.first: "Get §e128 oak§r and §e32 birch§r. This is an endurance test!"
quest.woodcutter.quest8.second: "Finished so quickly? Must be giant's blood flowing in you."

quest.woodcutter.quest9.first: "That's enough for today. Take a break from the axe."
quest.woodcutter.quest9.second: "You're here again? Perfect! There's plenty of work."

quest.woodcutter.quest10.first: "A friend needs help: §e64 birch§r and §e16 dark oak§r."
quest.woodcutter.quest10.second: "A real man of his word, I respect that."

quest.woodcutter.quest11.first: "I need §eacacia§r, but can't find suitable ones. Will you help?"
quest.woodcutter.quest11.second: "Your skills are impressive!"

quest.woodcutter.quest12.first: "A real lumberjack needs an §eiron axe§r. Make one!"
quest.woodcutter.quest12.second: "Now the forest will bow to you. Excellent work!"

quest.woodcutter.quest13.first: "Let's test the new axe. Bring §e64 acacia§r, §edark oak§r and §ebirch§r each."
quest.woodcutter.quest13.second: "Superb! Soon there won't be any forests left."

quest.woodcutter.quest14.first: "You've worked well. Rest a bit."
quest.woodcutter.quest14.second: "You're just in time! Real lumberjacks don't get rest."

quest.woodcutter.quest15.first: "Test your axe on planks: §e128 oak§r, §e192 birch§r and §e64 dark oak§r."
quest.woodcutter.quest15.second: "Now trees will fear your name."

quest.woodcutter.quest16.first: "Help a friend: §e64 acacia§r, §e128 dark oak§r, §e256 oak planks§r."
quest.woodcutter.quest16.second: "You're a real sawmill. Excellent!"

quest.woodcutter.quest17.first: "I'll introduce you to the §eMiner§r later. Now §e384 oak slabs§r, §e64 acacia§r, §e128 dark oak§r."
quest.woodcutter.quest17.second: "On time and on point. I respect that!"

quest.woodcutter.quest18.first: "§e64 jungle wood§r - valuable timber. Can you get it?"
quest.woodcutter.quest18.second: "You managed that too! Not surprised."

quest.woodcutter.quest19.first: "Exotic stuff: §e128 jungle wood§r, §e15 dead bushes§r, §e32 jungle leaves§r."
quest.woodcutter.quest19.second: "I'd go to the jungle with you! Well done!"

quest.woodcutter.quest20.first: "Forest needs restoration. §e15 saplings§r of each tree type."
quest.woodcutter.quest20.second: "You're strong and smart!"

quest.woodcutter.quest21.first: "Make a §ediamond axe§r for real masters."
quest.woodcutter.quest21.second: "Beautiful! Only saw such axes in legends."

quest.woodcutter.quest22.first: "Test the §ediamond axe§r: §e192 oak§r, §e192 dark oak§r, §e256 jungle wood§r, §e256 acacia§r."
quest.woodcutter.quest22.second: "You're a legend!"

quest.woodcutter.quest23.first: "Rest and come back later."
quest.woodcutter.quest23.second: "Your return is a celebration for me and terror for trees."

quest.woodcutter.quest24.first: "Help the builders: §e256 oak§r, §e256 jungle wood§r, §e320 oak slabs§r."
quest.woodcutter.quest24.second: "Reliable as granite!"

quest.woodcutter.quest25.first: "Final: §e32 oak saplings§r, §e128 jungle leaves§r, §e64 dark oak slabs§r, §e64 birch slabs§r, §e192 jungle logs§r, §e256 birch planks§r."
quest.woodcutter.quest25.second: "I could start a lumber business with you! Go to the §eMiner§r and tell him the best lumberjack in the area sent you!"

# MINER
quest.miner.quest1.first: "So the §eWoodcutter§r sent you? Make a §ewooden pickaxe§r and come back."
quest.miner.quest1.second: "I hope you know how to use it, not just hold it for show."

quest.miner.quest2.first: "Let's see you in action. Bring me §e9 coal§r."
quest.miner.quest2.second: "Not bad for a rookie. Keep it up!"

quest.miner.quest3.first: "Making it harder: §e32 cobblestone§r and §e16 coal§r."
quest.miner.quest3.second: "Maybe the §eWoodcutter§r was right about you. Let's see what's next."

quest.miner.quest4.first: "Show yourself: §e64 cobblestone§r and §e32 coal§r. Can't handle it?"
quest.miner.quest4.second: "Excellent work! You've earned respect."

quest.miner.quest5.first: "Stop carrying that wooden stick. Make a §estone pickaxe§r already."
quest.miner.quest5.second: "Now you look like a miner. Well done!"

quest.miner.quest6.first: "Stone's better than wood, but it's iron time. Bring §e32 iron ore§r, §e16 iron ingots§r and §e64 coal§r."
quest.miner.quest6.second: "You managed, but it'll get harder from here!"

quest.miner.quest7.first: "Let's test your strength: §e64 iron ingots§r, §e64 stone§r, §e32 coal§r, §e16 iron ore§r and §e128 cobblestone§r."
quest.miner.quest7.second: "A real miner! I respect that!"

quest.miner.quest8.first: "You've earned a rest. Come back later."
quest.miner.quest8.second: "Back already? Great, it was boring without you."

quest.miner.quest9.first: "Simple task: §e64 iron ingots§r, §e128 iron ore§r and §e128 coal§r."
quest.miner.quest9.second: "That's speed! Is your pickaxe still alive?"

quest.miner.quest10.first: "Your pickaxe is falling apart. Make an §eiron pickaxe§r and come back."
quest.miner.quest10.second: "Finally a proper tool. Well done!"

quest.miner.quest11.first: "Time for serious mining: §e32 gold ore§r, §e128 redstone§r, §e64 gold ingots§r and §e2 diamonds§r."
quest.miner.quest11.second: "Excellent work!"

quest.miner.quest12.first: "Big task: §e15 diamonds§r, §e64 gold ingots§r, §e2 emeralds§r, §e128 lapis lazuli§r and §e128 redstone§r."
quest.miner.quest12.second: "Incredible! You were definitely born in a mine!"

quest.miner.quest13.first: "Winter is coming: §e128 coal§r, §e128 stone§r, §e8 emeralds§r and §e64 gold ingots§r."
quest.miner.quest13.second: "Perfect, now we won't freeze."

quest.miner.quest14.first: "Make yourself a §ediamond pickaxe§r, time to test it in action."
quest.miner.quest14.second: "Now even mountains are within your reach!"

quest.miner.quest15.first: "Test the diamond pickaxe: §e256 cobblestone§r, §e128 iron ore§r and §e64 gold ore§r."
quest.miner.quest15.second: "Diamond pickaxe is power! Excellent work!"

quest.miner.quest16.first: "Need lots of materials: §e128 iron ingots§r, §e32 diamonds§r and §e256 coal§r."
quest.miner.quest16.second: "You're becoming a master of your craft!"

quest.miner.quest17.first: "Take a little rest, mining is hard work."
quest.miner.quest17.second: "Ready for new challenges? Then get to work!"

quest.miner.quest18.first: "Rare materials: §e64 emeralds§r, §e128 lapis lazuli§r and §e256 redstone§r."
quest.miner.quest18.second: "Such riches! You're a real treasure hunter!"

quest.miner.quest19.first: "Big order: §e512 cobblestone§r, §e256 stone§r and §e128 iron ingots§r."
quest.miner.quest19.second: "Mountains are no obstacle for you!"

quest.miner.quest20.first: "Precious stones: §e128 diamonds§r, §e64 emeralds§r and §e32 gold blocks§r."
quest.miner.quest20.second: "Immeasurable wealth! You're a legend of the depths!"

quest.miner.quest21.first: "Even a miner needs a break. Come back later."
quest.miner.quest21.second: "Missing the mines? I understand, they're calling!"

quest.miner.quest22.first: "Mass mining: §e256 iron ingots§r, §e128 gold ingots§r and §e64 diamonds§r."
quest.miner.quest22.second: "You've surpassed all miners I've ever known!"

quest.miner.quest23.first: "Extreme task: §e512 coal§r, §e256 iron ore§r and §e128 gold ore§r."
quest.miner.quest23.second: "Even a dragon would envy your supplies!"

quest.miner.quest24.first: "Penultimate trial: §e128 emeralds§r, §e256 lapis lazuli§r and §e512 redstone§r."
quest.miner.quest24.second: "Ready for the final challenge? Then gather all your strength!"

quest.miner.quest25.first: "Final challenge: §e256 emeralds§r and §e256 diamonds§r!"
quest.miner.quest25.second: "We're rich! Thank you, friend, now I can truly rest!"

