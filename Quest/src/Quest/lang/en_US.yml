# Quest 1: First trophies
quest.hunter.quest1.first: "§6Welcome, warrior! §fI'm a §bhunter§f and I hunt dangerous creatures. §eLet's start simple - bring me §68 rotten flesh§e from zombies. This will show your courage!"
quest.hunter.quest1.second: "§aExcellent! §fYou're not afraid of the undead. Rotten flesh will be useful for luring predators. §eNow you're ready for more serious challenges!"

