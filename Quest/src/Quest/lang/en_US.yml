quest.hunter.quest6.second: "§aWonderful! §fThis slime is sticky and elastic, perfect for pistons. §eYou've learned the secrets of underground creatures!"

# Quest 7: Ink for writing
quest.hunter.quest7.first: "§6Squids inhabit the ocean depths! §fTheir ink is valued by scribes and artists. §eCollect §610 ink sacs§e from squids. Dive deeper!"
quest.hunter.quest7.second: "§aExcellent! §fThis ink is black as night and never fades. §eYou've mastered underwater hunting!"

# Quest 8: Rest - studying behavior
quest.hunter.quest8.first: "§6Time to study monster behavior! §fKnowing their habits and weaknesses is the foundation of successful hunting. §eObserve, study, remember!"
quest.hunter.quest8.second: "§aGood! §fNow you know when and where to find each monster. §eKnowledge is your best weapon!"

# Quest 9: Night hunt
quest.hunter.quest9.first: "§6A true hunter doesn't fear the night! §fShow your mastery: get §620 rotten flesh§f, §615 bones§f and §618 strings§f. §eNight is the hunter's time!"
quest.hunter.quest9.second: "§aBrilliant! §fSuch a catch speaks of your mastery in night combat. §eYou're a true warrior of darkness!"

# Quest 10: Explosive cargo
quest.hunter.quest10.first: "§6A large batch of gunpowder is needed for military purposes! §fCreepers are cunning, but you're stronger. §eCollect §624 gunpowder§e for the arsenal!"
quest.hunter.quest10.second: "§aIncredible! §fSuch an amount of gunpowder is enough for a whole battery of cannons! §eYour courage knows no bounds!"

# Quest 11: Alchemical components
quest.hunter.quest11.first: "§6Alchemists need rare ingredients! §fCollect §616 spider eyes§f, §612 slimeballs§f and §620 gunpowder§f. §eCombine hunting different monsters!"
quest.hunter.quest11.second: "§aMagnificent! §fSuch a set of ingredients will allow creating powerful potions! §eYou supply alchemists with everything they need!"

# Quest 12: Ender pearl
quest.hunter.quest12.first: "§6Endermen are guardians of the void! §fTheir pearls possess teleportation power. §eGet §63 ender pearls§e. Don't look them in the eyes!"
quest.hunter.quest12.second: "§aAmazing! §fThese pearls shimmer with energy from other worlds. §eYou've fought the very guardians of the void!"

# Quest 13: Blaze rod
quest.hunter.quest13.first: "§6Blazes are spirits of hellish flame! §fTheir rods burn with eternal fire. §eGet §62 blaze rods§e from the Nether. Fire is their element!"
quest.hunter.quest13.second: "§aDelightful! §fThese rods blaze but don't burn. §eYou've conquered the very hellish flame!"

# Quest 14: Ghast tear
quest.hunter.quest14.first: "§6Ghasts are crying spirits of the Nether! §fTheir tears are rare and magically powerful. §eGet §61 ghast tear§e. Their fireballs are deadly!"
quest.hunter.quest14.second: "§aLegendary! §fA ghast tear is worth a fortune. §eYou've defeated one of the most dangerous opponents!"

# Quest 15: Magma cream
quest.hunter.quest15.first: "§6Magma cubes are spawn of lava! §fTheir cream burns but doesn't scorch hands. §eCollect §64 magma creams§e. Lava is their home!"
quest.hunter.quest15.second: "§aExcellent! §fThis cream is warm to the touch and smells of sulfur. §eYou've mastered hunting in lava caves!"

# Quest 16: Portal journey
quest.hunter.quest16.first: "§6Time for an expedition between worlds! §fCollect §68 ender pearls§f, §64 blaze rods§f and §62 ghast tears§f. §eShow mastery in different dimensions!"
quest.hunter.quest16.second: "§aIncredible! §fYou've mastered hunting in three dimensions! §eYour fame spreads across all worlds!"

# Quest 17: Rest - equipment upgrade
quest.hunter.quest17.first: "§6Time to upgrade equipment! §fSharp swords, strong armor and magical enchantments are the foundation of success. §eInvest in your armament!"
quest.hunter.quest17.second: "§aExcellent! §fNow you're armed like a true hero! §eYour equipment is worthy of legends!"

# Quest 18: Mass hunt
quest.hunter.quest18.first: "§6The army needs supplies! §fLead a mass hunt: §664 rotten flesh§f, §648 bones§f, §640 strings§f and §632 gunpowder§f. §eShow industrial scale!"
quest.hunter.quest18.second: "§aGrand! §fSuch volumes of trophies will supply an entire army! §eYou've become a true military commander!"

# Quest 19: Rare trophies
quest.hunter.quest19.first: "§6Collectors pay for rarities! §fCollect §632 spider eyes§f, §624 slimeballs§f and §632 ink sacs§f. §eRare trophies are valued by weight in gold!"
quest.hunter.quest19.second: "§aMagnificent! §fSuch a collection of rarities is worthy of the royal treasury! §eYour name is known to all collectors!"

