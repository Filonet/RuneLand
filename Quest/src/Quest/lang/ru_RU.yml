# Квест 18: Мясной ассортимент
quest.farmer.quest18.first: "§6Мясокомбинат заказал полный ассортимент! §fРазнообразие мяса - основа здорового питания. §eПоставь §620 говядины§e, §620 свинины§e, §615 баранины§e и §625 крольчатины§e!"
quest.farmer.quest18.second: "§aВосхитительно! §fТакой ассортимент обеспечит город качественным мясом на месяц! §eТвоя ферма стала настоящим предприятием!"

# Квест 19: Радужная шерсть
quest.farmer.quest19.first: "§6Художники заказали все цвета радуги! §fЯркая шерсть нужна для создания произведений искусства. §eСобери по §610 блоков§e циановой, фиолетовой, синей, коричневой, зелёной, красной и чёрной шерсти!"
quest.farmer.quest19.second: "§aПотрясающе! §fЭта радуга цветов вдохновит художников на шедевры! §eТы создаёшь красоту своими руками!"

# Квест 20: Кожевенное дело
quest.farmer.quest20.first: "§6Кожевенная мастерская расширяется! §fНужно много сырья для производства доспехов и седёл. §eПоставь §664 куска обычной кожи§e и §632 кроличьих шкурки§e!"
quest.farmer.quest20.second: "§aВеликолепно! §fРазные виды кожи позволят создавать изделия на любой вкус! §eТы снабжаешь всю округу качественным сырьём!"

# Квест 21: Отдых - модернизация оборудования
quest.farmer.quest21.first: "§6Время обновить оборудование фермы! §fСовременные технологии помогут увеличить производительность и улучшить условия для животных. §eИнвестиции в будущее всегда окупаются!"
quest.farmer.quest21.second: "§aОтлично! §fНовое оборудование сделает твою ферму образцовой! §eТеперь ты готов к самым амбициозным проектам!"

# Квест 22: Промышленное животноводство
quest.farmer.quest22.first: "§6Крупный заказ от столичного рынка! §fНужны огромные объёмы мяса для снабжения города. §eПоставь §640 говядины§e, §640 свинины§e, §650 курицы§e, §630 баранины§e и §635 крольчатины§e!"
quest.farmer.quest22.second: "§aНевероятно! §fТакие объёмы производства делают тебя одним из крупнейших поставщиков в регионе! §eТы достиг промышленного масштаба!"

# Квест 23: Перьевая подушка
quest.farmer.quest23.first: "§6Королевский заказ на роскошные подушки! §fДля набивки самых мягких подушек нужно много перьев. §eСобери §6128 перьев§e высшего качества!"
quest.farmer.quest23.second: "§aВосхитительно! §fИз этих перьев получатся подушки, достойные королевской спальни! §eТвоя продукция ценится в самых высоких кругах!"

# Квест 24: Шерстяная империя
quest.farmer.quest24.first: "§6Создай шерстяную империю! §fТекстильная фабрика заказала огромную партию разноцветной шерсти. §eПоставь §664 белой§e, по §632§e оранжевой, жёлтой, синей, красной и чёрной шерсти!"
quest.farmer.quest24.second: "§aПотрясающе! §fТвоя шерстяная империя обеспечит одеждой половину континента! §eТы стал магнатом текстильной промышленности!"

# Квест 25: Мастер животноводства
quest.farmer.quest25.first: "§6Финальное испытание мастера! §fПокажи все свои навыки в животноводстве. §eПоставь §6128 яиц§e, §696 кожи§e, §664 говядины§e, §664 свинины§e, §680 курицы§e, §6160 перьев§e и §6128 белой шерсти§e!"
quest.farmer.quest25.second: "§aЛегендарно! §fТы достиг вершин мастерства в животноводстве! §eТеперь ты §6Великий Мастер Фермер§e, и твоя слава распространится по всем землям! §bТвоя ферма стала образцом для подражания!"

# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
# ОХОТНИК - Квесты на дропы от неразмножаемых мобов
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

# Квест 1: Первые трофеи
quest.hunter.quest1.first: "§6Добро пожаловать, воин! §fЯ §bохотник§f и промышляю охотой на опасных существ. §eНачнём с простого - принеси мне §68 гнилого мяса§e от зомби. Это покажет твою храбрость!"
quest.hunter.quest1.second: "§aОтлично! §fТы не боишься нежити. Гнилое мясо пригодится для приманки хищников. §eТеперь ты готов к более серьёзным испытаниям!"

# Квест 2: Костная мука
quest.hunter.quest2.first: "§6Скелеты - древние стражи тьмы! §fИх кости - ценный материал для алхимии. §eДобудь §66 костей§e от скелетов. Будь осторожен с их стрелами!"
quest.hunter.quest2.second: "§aВеликолепно! §fЭти кости белые как снег и крепкие как сталь. §eТы доказал, что можешь сражаться с лучниками тьмы!"

# Квест 3: Паучьи сети
quest.hunter.quest3.first: "§6Пауки плетут сети крепче стали! §fИх нить незаменима для ловушек и верёвок. §eСобери §612 нитей§e от пауков. Остерегайся их яда!"
quest.hunter.quest3.second: "§aПревосходно! §fЭта нить тонкая, но невероятно прочная. §eТы освоил искусство охоты на паукообразных!"

# Квест 4: Взрывчатка
quest.hunter.quest4.first: "§6Криперы - живые бомбы природы! §fИх порох - основа для взрывчатых веществ. §eДобудь §610 пороха§e от криперов. Не дай им взорваться рядом с тобой!"
quest.hunter.quest4.second: "§aПотрясающе! §fТакой порох можно использовать для фейерверков и взрывчатки. §eТвоя ловкость в бою растёт с каждым днём!"

# Квест 5: Глаза хищника
quest.hunter.quest5.first: "§6Паучьи глаза видят в темноте! §fОни содержат магические свойства, нужные алхимикам. §eСобери §68 паучьих глаз§e. Сражайся храбро!"
quest.hunter.quest5.second: "§aВосхитительно! §fЭти глаза ещё светятся магической энергией. §eТы становишься настоящим охотником на монстров!"

# Квест 6: Липкая слизь
quest.hunter.quest6.first: "§6Слаймы - загадочные существа подземелий! §fИх слизь обладает уникальными свойствами. §eДобудь §65 слизи§e от слаймов. Они скользкие и быстрые!"
quest.hunter.quest6.second: "§aЗамечательно! §fЭта слизь липкая и эластичная, идеальна для поршней. §eТы познал тайны подземных существ!"

# Квест 7: Чернила для письма
quest.hunter.quest7.first: "§6Кальмары обитают в глубинах океана! §fИх чернила ценятся писарями и художниками. §eСобери §610 мешочков чернил§e от кальмаров. Ныряй глубже!"
quest.hunter.quest7.second: "§aПрекрасно! §fЭти чернила чёрные как ночь и никогда не выцветают. §eТы освоил подводную охоту!"

# Квест 8: Отдых - изучение повадок
quest.hunter.quest8.first: "§6Время изучить повадки монстров! §fЗнание их привычек и слабостей - основа успешной охоты. §eНаблюдай, изучай, запоминай!"
quest.hunter.quest8.second: "§aХорошо! §fТеперь ты знаешь, когда и где искать каждого монстра. §eЗнания - твоё лучшее оружие!"

# Квест 9: Ночная охота
quest.hunter.quest9.first: "§6Настоящий охотник не боится ночи! §fПокажи своё мастерство: добудь §620 гнилого мяса§f, §615 костей§f и §618 нитей§f. §eНочь - время охотника!"
quest.hunter.quest9.second: "§aБлестяще! §fТакой улов говорит о твоём мастерстве в ночном бою. §eТы истинный воин тьмы!"

# Квест 10: Взрывоопасный груз
quest.hunter.quest10.first: "§6Большая партия пороха нужна для военных целей! §fКриперы коварны, но ты сильнее. §eСобери §624 пороха§e для арсенала!"
quest.hunter.quest10.second: "§aНевероятно! §fТакого количества пороха хватит на целую батарею пушек! §eТвоя храбрость не знает границ!"

# Квест 11: Алхимические компоненты
quest.hunter.quest11.first: "§6Алхимики нуждаются в редких ингредиентах! §fСобери §616 паучьих глаз§f, §612 слизи§f и §620 пороха§f. §eКомбинируй охоту на разных монстров!"
quest.hunter.quest11.second: "§aВеликолепно! §fТакой набор ингредиентов позволит создать мощные зелья! §eТы снабжаешь алхимиков всем необходимым!"

# Квест 12: Эндер жемчужина
quest.hunter.quest12.first: "§6Эндермены - стражи пустоты! §fИх жемчуг обладает силой телепортации. §eДобудь §63 эндер жемчужины§e. Не смотри им в глаза!"
quest.hunter.quest12.second: "§aПотрясающе! §fЭти жемчужины мерцают энергией иных миров. §eТы сразился с самими стражами пустоты!"

# Квест 13: Огненный стержень
quest.hunter.quest13.first: "§6Блейзы - духи адского пламени! §fИх стержни горят вечным огнём. §eДобудь §62 огненных стержня§e из Нижнего мира. Огонь - их стихия!"
quest.hunter.quest13.second: "§aВосхитительно! §fЭти стержни пылают, но не сгорают. §eТы покорил само адское пламя!"

# Квест 14: Слёзы гаста
quest.hunter.quest14.first: "§6Гасты - плачущие духи Нижнего мира! §fИх слёзы редки и магически сильны. §eДобудь §61 слезу гаста§e. Их огненные шары смертельны!"
quest.hunter.quest14.second: "§aЛегендарно! §fСлеза гаста стоит целого состояния. §eТы победил одного из самых опасных противников!"

# Квест 15: Магматический крем
quest.hunter.quest15.first: "§6Магматические кубы - порождения лавы! §fИх крем горит, но не обжигает руки. §eСобери §64 магматических крема§e. Лава - их дом!"
quest.hunter.quest15.second: "§aОтлично! §fЭтот крем тёплый на ощупь и пахнет серой. §eТы освоил охоту в лавовых пещерах!"

# Квест 16: Портальное путешествие
quest.hunter.quest16.first: "§6Время для экспедиции между мирами! §fСобери §68 эндер жемчужин§f, §64 огненных стержня§f и §62 слезы гаста§f. §eПокажи мастерство в разных измерениях!"
quest.hunter.quest16.second: "§aНевероятно! §fТы освоил охоту в трёх измерениях! §eТвоя слава распространяется по всем мирам!"

# Квест 17: Отдых - улучшение снаряжения
quest.hunter.quest17.first: "§6Время улучшить снаряжение! §fОстрые мечи, прочная броня и волшебные зачарования - основа успеха. §eИнвестируй в своё вооружение!"
quest.hunter.quest17.second: "§aОтлично! §fТеперь ты вооружён как настоящий герой! §eТвоё снаряжение достойно легенд!"

# Квест 18: Массовая охота
quest.hunter.quest18.first: "§6Армия нуждается в припасах! §fВеди массовую охоту: §664 гнилого мяса§f, §648 костей§f, §640 нитей§f и §632 пороха§f. §eПокажи промышленные масштабы!"
quest.hunter.quest18.second: "§aГрандиозно! §fТакие объёмы трофеев обеспечат целую армию! §eТы стал настоящим военачальником!"

# Квест 19: Редкие трофеи
quest.hunter.quest19.first: "§6Коллекционеры платят за редкости! §fСобери §632 паучьих глаза§f, §624 слизи§f и §632 чернил§f. §eРедкие трофеи ценятся на вес золота!"
quest.hunter.quest19.second: "§aВеликолепно! §fТакая коллекция редкостей достойна королевской сокровищницы! §eТвоё имя знают все коллекционеры!"

# Квест 20: Эндер коллекция
quest.hunter.quest20.first: "§6Эндер жемчужины - ключ к магии телепортации! §fМагистр порталов нуждается в большой партии. §eСобери §616 эндер жемчужин§e для великого ритуала!"
quest.hunter.quest20.second: "§aНевероятно! §fС такой коллекцией можно открыть портал в любую точку мира! §eТы мастер охоты на эндерменов!"

# Квест 21: Отдых - древние знания
quest.hunter.quest21.first: "§6Время изучить древние тексты об охоте! §fСтарые книги содержат секреты, утерянные веками. §eЗнания предков сделают тебя непобедимым!"
quest.hunter.quest21.second: "§aМудро! §fТеперь ты знаешь секреты древних охотников. §eИх мудрость течёт в твоих жилах!"

# Квест 22: Адские материалы
quest.hunter.quest22.first: "§6Нижний мир полон опасностей и богатств! §fСобери §68 огненных стержней§f, §64 слезы гаста§f и §612 магматических кремов§f. §eАд ждёт героя!"
quest.hunter.quest22.second: "§aЛегендарно! §fТы покорил самые опасные глубины Нижнего мира! §eДаже демоны знают твоё имя!"

# Квест 23: Алхимический склад
quest.hunter.quest23.first: "§6Великий алхимик заказал огромную партию! §fНужно §664 паучьих глаза§f, §664 пороха§f и §648 слизи§f. §eСоздай алхимическую империю!"
quest.hunter.quest23.second: "§aПотрясающе! §fТакого склада хватит на создание тысяч зелий! §eТы стал главным поставщиком алхимиков!"

# Квест 24: Мастер порталов
quest.hunter.quest24.first: "§6Финальный ритуал требует множества материалов! §fСобери §632 эндер жемчужины§f, §616 огненных стержней§f и §68 слёз гаста§f. §eСтань повелителем порталов!"
quest.hunter.quest24.second: "§aВосхитительно! §fС такими материалами можно построить целую сеть порталов! §eТы мастер межпространственных путешествий!"

# Квест 25: Легендарный охотник
quest.hunter.quest25.first: "§6Финальное испытание героя! §fПокажи всё своё мастерство: §6128 гнилого мяса§f, §696 костей§f, §680 нитей§f, §664 пороха§f, §648 глаз§f, §624 жемчужины§f, §612 стержней§f и §66 слёз§f!"
quest.hunter.quest25.second: "§aНЕВЕРОЯТНО! §fТы достиг вершин охотничьего мастерства! §eТеперь ты §6Легендарный Охотник§e, и твоё имя будут помнить века! §bДаже древние монстры преклоняются перед твоей силой!"